name: pub
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: lnx
          - os: windows-latest
            name: win
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out d
      - uses: actions/upload-artifact@v4
        with:
          name: whl-${{ matrix.name }}
          path: d

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FreeBSD wheel
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15'
          sync: rsync
          prepare: pkg install -y python311 rust
          run: |
            fetch -o /tmp/get-pip.py https://bootstrap.pypa.io/get-pip.py
            python3.11 /tmp/get-pip.py --user
            python3.11 -m venv .venv
            .venv/bin/pip install maturin
            .venv/bin/maturin build --release --manifest-path ext_rust/Cargo.toml --out d
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-wheel
          path: d

  termux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in Termux environment
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            termux/termux-docker:x86_64 \
            /data/data/com.termux/files/usr/bin/bash -lc 'pkg update -y || pkg update -y || pkg update -y && pkg install -y python rust clang && export CARGO_TARGET_DIR="$PREFIX/tmp/goygram-target" PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 && py_lib=$(printf "%s\\n" "$PREFIX"/lib/libpython3.*.so | head -n 1) && test -f "$py_lib" && ln -sf "$py_lib" "$PREFIX/tmp/libpython3.11.so" && export RUSTFLAGS="-L$PREFIX/tmp" && cd /src && cargo build --release --manifest-path ext_rust/Cargo.toml && mkdir -p d && cp "$CARGO_TARGET_DIR/release/libgoygram_ext.so" d/goygram-termux-x86_64.so'
      - uses: actions/upload-artifact@v4
        with:
          name: termux-native
          path: d

  src:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out d
      - uses: actions/upload-artifact@v4
        with:
          name: whl-src
          path: d

  pub:
    runs-on: ubuntu-latest
    needs: [build, freebsd, termux, src]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: whl-*
          merge-multiple: true
          path: d
      - uses: actions/download-artifact@v4
        with:
          name: freebsd-wheel
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: termux-native
          path: release-assets
      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "GoyGram $GITHUB_REF_NAME" --generate-notes
      - name: Upload non-PyPI platform assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
      - uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing d/*
