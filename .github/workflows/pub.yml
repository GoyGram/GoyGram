name: pub
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: lnx-x64
            target: x86_64-unknown-linux-gnu
            manylinux: '2_34'
          - os: ubuntu-latest
            name: lnx-arm64
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
          - os: ubuntu-latest
            name: musl-x64
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: ubuntu-latest
            name: musl-arm64
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: macos-latest
            name: mac-arm64
            target: aarch64-apple-darwin
            manylinux: 'auto'
          - os: macos-latest
            name: mac-univ2
            target: universal2-apple-darwin
            manylinux: 'auto'
          - os: windows-latest
            name: win-x64
            target: x86_64-pc-windows-msvc
            manylinux: 'auto'
          - os: windows-latest
            name: win-arm64
            target: aarch64-pc-windows-msvc
            manylinux: 'auto'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Add the cross target
        if: runner.os != 'Linux' && !contains(matrix.target, 'universal2')
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out d
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whl-${{ matrix.name }}
          path: d

  dro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-linux-android
            name: dro-arm64
          - triple: x86_64-linux-android
            name: dro-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.triple }}
      - name: Android Python for cross-compilation
        run: |
          curl -sSfLo py.tgz "https://www.python.org/ftp/python/3.14.3/python-3.14.3-${{ matrix.triple }}.tar.gz"
          tar xzf py.tgz
          echo "PYO3_CROSS_LIB_DIR=$PWD/prefix/lib" >> "$GITHUB_ENV"
      - name: Android NDK toolchain
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          bin="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="$bin/${TRIPLE}24-clang"
          {
            echo "ANDROID_CC=$cc"
            echo "ANDROID_API_LEVEL=24"
            echo "CC=$cc"
            echo "CXX=${cc}++"
            echo "AR=$bin/llvm-ar"
            echo "CARGO_TARGET_$(echo "$TRIPLE" | tr 'a-z-' 'A-Z_')_LINKER=$GITHUB_WORKSPACE/ci/android-linker.py"
          } >> "$GITHUB_ENV"
      - name: Build wheel
        run: |
          pip install --quiet maturin
          maturin build --release --target ${{ matrix.triple }} --out d
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whl-${{ matrix.name }}
          path: d

  src:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out d
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whl-src
          path: d

  pub:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build, dro, src]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: whl-*
          merge-multiple: true
          path: d
      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "GoyGram $GITHUB_REF_NAME" --generate-notes
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing d/*
