name: pub
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: lnx
          - os: windows-latest
            name: win
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out d
      - uses: actions/upload-artifact@v4
        with:
          name: whl-${{ matrix.name }}
          path: d

  dro:
    strategy:
      matrix:
        include:
          - triple: aarch64-linux-android
            name: dro-arm64
          - triple: x86_64-linux-android
            name: dro-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - name: Android Python for cross-compilation
        run: |
          curl -sSfLo py.tgz "https://www.python.org/ftp/python/3.14.3/python-3.14.3-${{ matrix.triple }}.tar.gz"
          tar xzf py.tgz
          echo "PYO3_CROSS_LIB_DIR=$PWD/prefix/lib" >> "$GITHUB_ENV"
      - name: Android NDK toolchain
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          bin="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="$bin/${TRIPLE}24-clang"
          {
            echo "ANDROID_CC=$cc"
            echo "ANDROID_API_LEVEL=24"
            echo "CC=$cc"
            echo "CXX=${cc}++"
            echo "AR=$bin/llvm-ar"
            echo "CARGO_TARGET_$(echo "$TRIPLE" | tr 'a-z-' 'A-Z_')_LINKER=$GITHUB_WORKSPACE/ci/android-linker.py"
          } >> "$GITHUB_ENV"
      - name: Build wheel
        run: |
          pip install --quiet maturin
          maturin build --release --target ${{ matrix.triple }} --out d
      - uses: actions/upload-artifact@v4
        with:
          name: whl-${{ matrix.name }}
          path: d

  src:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out d
      - uses: actions/upload-artifact@v4
        with:
          name: whl-src
          path: d

  pub:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build, dro, src]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: whl-*
          merge-multiple: true
          path: d
      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "GoyGram $GITHUB_REF_NAME" --generate-notes
      - uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing d/*
