name: stubs
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/gen_stubs.py
      - .github/workflows/stubs.yml
      - ext_rust/src/bootstrap.json
      - goygram/__init__.pyi
      - goygram/ext.pyi
jobs:
  stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/gen_stubs.py
      - name: stubs must match schema and Bot API docs
        run: git diff --exit-code -- goygram/__init__.pyi goygram/ext.pyi goygram/py.typed
