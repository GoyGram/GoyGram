name: strict
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . basedpyright==1.40.1
      - run: basedpyright --project pyrightconfig.json
